# gradle/libs.versions.toml
[versions]
lightningkmp = "1.10.4"
secp256k1 = "0.18.0" # keep in check with lightning-kmp secp version

kotlin = "2.1.10"
ktor = "3.1.0"
sqldelight = "2.0.2"
okio = "3.8.0"

# iOS
skie = "0.10.1"

# Android
androidx-junit = "1.1.3"
androidx-corektx = "1.13.1"
androidx-appcompat = "1.7.0"
androidx-lifecycle = "2.8.7"

androidx-biometrics = "1.1.0"
androidx-datastore = "1.1.2"
androidx-workmanager = "2.9.1"

androidx-compose-common = "1.8.0"
androidx-compose-navigation = "2.8.7"
androidx-compose-constraintlayout = "1.1.0"
androidx-compose-material3 = "1.3.1"
accompanist = "0.30.1"

slf4j = "2.0.16"
zxing = "3.5.3"
logback = "3.0.0"

fcm = "24.1.0"
playservices = "18.5.0"

junit = "4.13"
espresso = "3.3.0"
robolectric = "4.13"
agp = "8.7.3"
junit-version = "4.13.2"
androidx-junit-version = "1.2.1"
espresso-core = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.2.1" # <--- **CHANGE THIS LINE**

[libraries]
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kgp = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
sqldelight-plugin = { group = "app.cash.sqldelight", name = "gradle-plugin", version.ref = "sqldelight" }
fcm-plugin = { module = "com.google.gms:google-services", version = "4.4.2" }
junit = { group = "junit", name = "junit", version.ref = "junit-version" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit-version" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

