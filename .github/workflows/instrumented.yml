# The instrumented suite, on a real emulator.
#
# This is where the SDK's actual safety argument lives. Masking, capture composition, window
# geometry and the Compose probes cannot be checked without a running framework, so almost
# nothing here has a unit-test equivalent — and before this workflow existed they ran only when
# somebody remembered to plug in a phone. The masking bug fixed in 0.13.1 shipped in a release
# for exactly that reason.
name: instrumented

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # Both API levels report, rather than the first failure hiding the second. They fail
      # differently: API 36 removed `InputManager.getInstance`, which is why the suite needs
      # Espresso 3.7.0, and that kind of break is per-platform by nature.
      fail-fast: false
      matrix:
        api-level: [34, 36]
        # The Compose version is a second axis, for the same reason the first one exists.
        #
        # This module compiles against its own BOM, but `ui-tooling-data` is declared without a
        # version so it follows the *consumer's* — and the skeleton scan is built on it. When
        # Compose dropped `ComposerImpl$CompositionContextHolder`, the reflective walk stopped
        # finding subcompositions: every `LazyColumn` and `Scaffold` screen stored a wireframe
        # containing a single rect, in a shipped release, while all 61 tests here stayed green.
        # They ran on the old BOM, which was the only Compose they had ever seen.
        #
        # `default` is this module's declared BOM; the pinned one is a current release. When a
        # newer Compose ships, raise the pin rather than replacing `default` — the pair is the
        # test, and one version alone is what made this bug invisible.
        compose-bom: [default, '2026.02.01']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without hardware acceleration the emulator is too slow to finish this suite inside any
      # sane timeout. The runner has KVM; it just is not readable by the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          script: |
            # Three-button navigation, and this is load-bearing rather than a preference.
            #
            # `DialogMaskingTest` checks that a dialog's mask lands on its text. The error it
            # guards against is `(statusBar - navBar) / 2`, and under gesture navigation both
            # bars are the same height — so the error is exactly zero and the test passes
            # without having tested anything. That is how the bug reached a release in the
            # first place. Three-button navigation makes the bars asymmetric and the check real.
            adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton
            adb shell cmd overlay disable com.android.internal.systemui.navbar.gestural
            sleep 5

            # Printed so a run can be read after the fact: if the overlay ever stops applying,
            # the placement cases go quietly green and this line is the only thing that says so.
            adb shell cmd overlay list android | grep navbar || true

            # One command per line, and it has to stay that way.
            #
            # `android-emulator-runner` does not hand this block to a shell. It splits it on
            # newlines and runs each line as its own `sh -c`, so nothing here can span lines: an
            # `if`/`else`/`fi` fails on its own first line with "end of file unexpected", which
            # is what happened to every emulator job the first time this ran. A `\` continuation
            # breaks the same way. If something ever needs a conditional, put it where it can be
            # expressed — a `${{ }}` expression, a prior step, or the build script.
            #
            # `default` is understood by the build script as "leave the declared BOM alone", so
            # the flag is passed unconditionally and there is nothing to branch on.
            ./gradlew :lightsession-android:connectedDebugAndroidTest -Pls.composeBomUnderTest=${{ matrix.compose-bom }}

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports-api${{ matrix.api-level }}-compose-${{ matrix.compose-bom }}
          path: |
            lightsession-android/build/reports/androidTests/
            lightsession-android/build/outputs/androidTest-results/
          retention-days: 14
